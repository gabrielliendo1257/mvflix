spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mvflix_authorized_db
    username: db_rw
    password: 12345678

  flyway:
    enabled: true
    user: db_migrator
    password: 12345678

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

logging:
  level:
    root: info
    '[org.springframework.web]': debug
    org.springframework.security: debug
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: trace
    org.springframework.security.oauth2: debug
    org.springframework.data.redis: debug
    jakarta.jms: debug

authorization:
  env:
    oauth2:
      registration-id: movie-app
      client-id: movie-bff
      client-password: super-secret
      redirect: ${BFF_ADDRESS:http://127.0.0.1:9090}${BFF_PATH_REDIRECT:/login/oauth2/movietv}
      logout-redirect: ${FRONTEND_ADDRESS:http://localhost:9090}${PATH_LOGOUT_REDIRECT:/}
    # jwk:
    #   uri: "lb://authorization-service/oauth2/jwks"
    api:
      path-base: /api/v1/authorization

server:
  address: 0.0.0.0
  port: 9090
