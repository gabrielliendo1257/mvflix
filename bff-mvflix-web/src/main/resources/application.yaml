spring:
  application:
    name: bff-mvflix-web
  security:
    oauth2:
      client:
        registration:
          movie-app:
            provider: mvflix-auth
            client-id: movie-bff
            client-secret: super-secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/movietv"
            scope: users.read, users.write
        provider:
          mvflix-auth:
            authorization-uri: ${AUTHORIZATION_ISSUER_URL:http://localhost:9090}/oauth2/authorize
            token-uri: ${AUTHORIZATION_ISSUER_URL:http://localhost:9090}/oauth2/token
            user-info-uri: ${AUTHORIZATION_ISSUER_URL:http://localhost:9090}/userinfo
            jwk-set-uri: ${AUTHORIZATION_ISSUER_URL:http://localhost:9090}/oauth2/jwks

services:
  users:
    url: ${SERVICES_USERS_URL:http://localhost:8081}
  storage:
    url: ${SERVICES_STORAGE_URL:http://localhost:8082}