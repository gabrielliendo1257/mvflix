# Perfil de desarrollo/sandbox: sin authorization-service ni login OAuth2.
# Todo el API queda abierto; los downstream (users, storage, movies) se asumen
# tambien en sandbox, asi que no se inyecta ningun token.
spring:
  application:
    name: bff-mvflix-web
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.reactive.ReactiveOAuth2ClientAutoConfiguration

server:
  port: 9091
  error:
    include-stacktrace: never
    include-message: never

services:
  users:
    url: ${SERVICES_USERS_URL:http://127.0.0.1:8080}
  storage:
    url: ${SERVICES_STORAGE_URL:http://127.0.0.1:6060}
  movies:
    url: ${SERVICES_MOVIES_URL:http://127.0.0.1:4040}
  authorization:
    url: ${AUTHORIZATION_URL:http://127.0.0.1:9090}

frontend:
  url: ${FRONTEND_URL:http://127.0.0.1:4200}

bff:
  webclient:
    connect-timeout-ms: 2000
    response-timeout-ms: 30000

logging:
  level:
    root: info
    com.guille.media.bff: debug
    org.springframework.security: debug
    org.springframework.web.reactive.function.client: debug