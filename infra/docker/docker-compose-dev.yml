services:
  minio:
    image: quay.io/minio/minio
    container_name: minio-container

    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?define MINIO_ROOT_USER en infra/docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?define MINIO_ROOT_PASSWORD en infra/docker/.env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:4200,http://localhost:9090}
      MINIO_NOTIFY_WEBHOOK_ENABLE_upload: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_upload: "http://host.docker.internal:6060/internal/minio/events"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_upload: ${MINIO_WEBHOOK_TOKEN:-dev-webhook-secret}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc
    container_name: minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/users;
      mc anonymous set none local/users;
      mc mb --ignore-existing local/uploads;
      mc anonymous set none local/uploads;
      mc event rm --force local/uploads arn:minio:sqs::upload:webhook;
      mc event add local/uploads arn:minio:sqs::upload:webhook --event 'put';
      exit 0;
      "

  postgres:
    image: postgres:16.11-alpine3.22
    container_name: postgres
    restart: unless-stopped
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en infra/docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en infra/docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mvflix_app}
    ports:
    - "5432:5432"
    volumes:
      - pg_volume:/var/lib/postgresql/data:rw
      - ../postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 120s

volumes:
  minio_data:
    driver: local
  pg_volume:
    driver: local
