services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio-container

    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?define MINIO_ROOT_USER en infra/docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?define MINIO_ROOT_PASSWORD en infra/docker/.env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:4200,http://localhost:9090}
      MINIO_NOTIFY_WEBHOOK_ENABLE_upload: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_upload: ${MINIO_WEBHOOK_ENDPOINT:-http://host.docker.internal:6060/internal/minio/events}
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_upload: ${MINIO_WEBHOOK_TOKEN:-dev-webhook-secret}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: server /data --console-address ":9001"

    volumes:
      - "${MINIO_DATA_SOURCE:-minio_data}:/data"

    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/users;
      mc anonymous set none local/users;
      mc mb --ignore-existing local/uploads;
      mc anonymous set none local/uploads;
      mc event rm --force local/uploads arn:minio:sqs::upload:webhook;
      mc event add local/uploads arn:minio:sqs::upload:webhook --event 'put';
      exit 0;
      "

  postgres:
    image: postgres:16.11-alpine3.22
    container_name: postgres
    restart: unless-stopped
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en infra/docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en infra/docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mvflix_app}
    ports:
    - "5432:5432"
    volumes:
      - pg_volume:/var/lib/postgresql/data:rw
      - ../postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 120s

  kafka:
    image: bitnami/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped

    # El listener externo debe ser accesible desde Termux u otros clientes de
    # la LAN. El listener interno y el de controller no se exponen a la LAN.
    ports:
      - "0.0.0.0:${KAFKA_EXTERNAL_PORT:-9094}:9094"

    environment:
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-abcdefghijklmnopqrstuv}
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-1}
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_CFG_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_CFG_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-536870912}
      KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS: ${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-300000}
      ALLOW_PLAINTEXT_LISTENER: "yes"

    volumes:
      - "${KAFKA_DATA_SOURCE:-kafka_data}:/bitnami/kafka"

    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: bitnami/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/bash -ec "
       for topic in \
         mvflix.managed-media-deletion-requested.v1 \
         mvflix.managed-media-deletion-requested.v1.retry-0 \
         mvflix.managed-media-deletion-requested.v1.retry-1 \
         mvflix.managed-media-deletion-requested.v1.retry-2 \
         mvflix.managed-media-deletion-requested.v1.DLT \
         mvflix.stored-object-deleted.v1 \
         mvflix.stored-object-deleted.v1.retry-0 \
         mvflix.stored-object-deleted.v1.retry-1 \
         mvflix.stored-object-deleted.v1.retry-2 \
         mvflix.stored-object-deleted.v1.DLT; do
         kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
         --topic $$topic --partitions ${KAFKA_NUM_PARTITIONS:-1} --replication-factor 1
         --config retention.ms=${KAFKA_LOG_RETENTION_MS:-604800000}
         --config retention.bytes=${KAFKA_LOG_RETENTION_BYTES:-1073741824};
       done;
       exit 0;
       "

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env=true
      - --storage.tsdb.path=/prometheus
    environment:
      ACTUATOR_METRICS_USER: ${ACTUATOR_METRICS_USER:-metrics}
      ACTUATOR_METRICS_PASSWORD: ${ACTUATOR_METRICS_PASSWORD:-change-me}
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9095}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "${OTEL_BIND_ADDRESS:-0.0.0.0}:${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      tempo:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  minio_data:
    driver: local
  pg_volume:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
