server:
  port: 6060

api:
  path:
    base: /api/v1/movie

spring:
  application:
    name: powercine

  autoconfigure:
    exclude:
      #- org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      #- org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/mvflix_uploads_db
    username: ${DB_RW_USER:db_rw}
    password: ${DB_RW_PASSWORD:12345678}

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/mvflix_uploads_db
    username: ${DB_MIGRATOR_USER:db_migrator}
    password: ${DB_MIGRATOR_PASSWORD:12345678}

services:
  authorization:
    url: ${AUTHORIZATION_URL:http://127.0.0.1:9090}

security:
  oauth2:
    jwk-set-uri: ${SECURITY_OAUTH2_JWK_SET_URI:http://127.0.0.1:9090/oauth2/jwks}

minio:
  url: ${MINIO_URL:http://127.0.0.1:9000}
  access-key: admin
  secret-key: admin123
  bucket: uploads
  webhook-token: ${MINIO_WEBHOOK_TOKEN:dev-webhook-secret}

storage:
  session:
    time-to-live: 60m
    expiration-check-ms: 60000
  streaming:
    url-ttl: 3h
  # Bibliotecas del operador (media server). LOCAL -> directorio del filesystem.
  # Son también las raíces permitidas para las bibliotecas registradas en runtime.
  # En dev se acepta cualquier directorio (USB, Descargas, etc.); para restringir,
  # poner allow-any-root: false y listar raíces aquí.
  allow-any-root: true
  allowed-roots:
    - /tmp/mvflix-media
    - /run/media/backdev/DATA_A/
    - "/home/backdev/Descargas/Telegram Desktop"

logging:
  level:
    root: info
    org.springframework.web: debug
    org.springframework.security: debug
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: trace
    org.springframework.security.oauth2: debug
    org.springframework.data.redis: debug
    jakarta.jms: debug
