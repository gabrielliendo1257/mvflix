server:
  host: 0.0.0.0
  port: 6060
  servlet:
    session:
      timeout: 5m

spring:
  application:
    name: powercine

  autoconfigure:
    exclude:
      #- org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      #- org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/mvflix_db #;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: admin
    password: admin123

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

services:
  authorization:
    url: ${AUTHORIZATION_URL:http://localhost:9090}

security:
  jwt:
    issuer: storage-service
    access-token-secret: >
      8d2f2d4b0d6c9e8f2c7b4a1f9e6d3c7b8a1d2e3f4c5b6a7d8e9f0a1b2c3d4e5
    refresh-token-secret: >
      9e1c4a7f2b6d8c0f3a5b7d9e1c2f4a6b8d0e2f4c6b8a0d2e4f6a8c0e2f4b6d
    access-token-expiration: 30m
    refresh-token-expiration: 30d

minio:
  url: ${MINIO_URL}
  access-key: admin
  secret-key: admin123
  bucket: uploads

storage:
  session:
    time-to-live: 60m
    expiration-check-ms: 60000

logging:
  level:
    root: info
    org.springframework.web: debug
    org.springframework.security: debug
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: trace
    org.springframework.security.oauth2: debug
    org.springframework.data.redis: debug
    jakarta.jms: debug
