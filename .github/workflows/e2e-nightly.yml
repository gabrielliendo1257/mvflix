name: E2E Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run E2E stack
        run: ./scripts/e2e.sh

      - name: Collect container logs
        if: failure()
        run: docker compose --env-file infra/docker/container-versions.env -f e2e/docker-compose-e2e.yml logs --no-color
